name: Release prebuilt plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'geekjourneyx/dsh-md2wechat'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag, version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node scripts/release.mjs validate "$RELEASE_TAG" > "$RUNNER_TEMP/version.json"
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.argv[1])); for (const key of ["tag", "prerelease"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${v[key]}\n`)' "$RUNNER_TEMP/version.json"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm check:boundaries && pnpm test && pnpm build
      - name: Stage verified prebuilt package and SHA256
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/packed"
          mapfile -t archives < <(find "$RUNNER_TEMP/packed" -maxdepth 1 -name '*.tgz')
          test "${#archives[@]}" -eq 1
          node scripts/check-boundaries.mjs "${archives[0]}"
          node scripts/release.mjs artifact "$RELEASE_TAG" "${archives[0]}" "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create a new release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to replace it; inspect any failed draft manually.' >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          DSH 一站式公众号创作插件预发布版，可直接安装下方 tgz，无需自行编译。
          支持相互匹配的 DSH 宿主与网页客户端 0.2.0-rc.2、0.2.1-rc.2、0.2.1-rc.4；需单独安装兼容的 md2wechat CLI。
          新增「高级排版」入口，按文章选择模块，整篇最多 8 个，确认建议后应用。
          修正预览失败提示，区分标题、作者、摘要超限，以及密钥、连接和超时问题。
          下载后用 SHA256SUMS 校验，再使用 dsh plugin --profile web add 安装 tgz。详细安装与配置见 README。
          本地模拟服务的自动化验收不代表真实付费生图或公众号投递已经验证。插件仅保存未发布草稿，不发布或群发文章。
          NOTES
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          gh release upload "$RELEASE_TAG" ./*.tgz SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
