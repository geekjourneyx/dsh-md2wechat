name: Release prebuilt plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'geekjourneyx/dsh-md2wechat'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag, version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node scripts/release.mjs validate "$RELEASE_TAG" > "$RUNNER_TEMP/version.json"
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.argv[1])); for (const key of ["tag", "prerelease"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${v[key]}\n`)' "$RUNNER_TEMP/version.json"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm check:boundaries && pnpm test && pnpm build
      - name: Stage verified prebuilt package and SHA256
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/packed"
          mapfile -t archives < <(find "$RUNNER_TEMP/packed" -maxdepth 1 -name '*.tgz')
          test "${#archives[@]}" -eq 1
          node scripts/check-boundaries.mjs "${archives[0]}"
          node scripts/release.mjs artifact "$RELEASE_TAG" "${archives[0]}" "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create a new release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to replace it; inspect any failed draft manually.' >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Prebuilt DSH plugin; no source checkout or plugin compilation required.
          Requires DSH host + web client 0.2.1-rc.2 and separately installed md2wechat CLI 3.3.0.
          Verify the tgz using SHA256SUMS, then install the local archive with dsh plugin --profile web add.
          Do not install into DSH 0.2.0-rc.2 or bypass its peer compatibility checks.
          Creator browser/live-provider acceptance remains incomplete; this release does not claim production acceptance.
          The plugin never publishes articles. Review the included README for credentials, setup and approval boundaries.
          NOTES
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          gh release upload "$RELEASE_TAG" ./*.tgz SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
